services:
  - type: web
    name: xult-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      - key: TWITTER_BEARER_TOKEN
        sync: false
      - key: GIPHY_API_KEY
        sync: false
      - key: BOT_OWNER_ID
        value: 1302203907782606880
      - key: API_PORT
        value: 5000
      - key: PYTHON_VERSION
        value: 3.11.0
